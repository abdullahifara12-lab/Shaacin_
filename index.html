<!DOCTYPE html>
<html lang="so">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BURSALAH SECONDARY SCHOOL</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at top left,#173b8f,transparent 35%),
    radial-gradient(circle at bottom right,#00a6a6,transparent 35%),
    linear-gradient(135deg,#06142f,#071952);
    color:white;
}

header{
    text-align:center;
    padding:35px 15px 25px;
}

.logo{
    width:75px;
    height:75px;
    margin:auto;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#ffd700,#ff9d00);
    color:#071952;
    font-size:36px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

header h1{
    margin-top:15px;
    font-size:28px;
}

header p{
    margin-top:8px;
    color:#ccecff;
}

.container{
    width:94%;
    max-width:900px;
    margin:auto;
}

.search-box{
    background:rgba(255,255,255,.10);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.18);
    border-radius:25px;
    padding:25px;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.search-box h2{
    text-align:center;
    margin-bottom:8px;
}

.description{
    text-align:center;
    color:#cdeaf4;
    font-size:14px;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:bold;
}

input{
    width:100%;
    padding:16px;
    border:none;
    outline:none;
    border-radius:14px;
    font-size:17px;
    background:white;
    color:#17202a;
    text-transform:uppercase;
}

button{
    width:100%;
    padding:16px;
    border:0;
    border-radius:14px;
    margin-top:17px;
    background:linear-gradient(90deg,#ffd700,#ffb300);
    color:#071952;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

#result{
    display:none;
    margin-top:25px;
    margin-bottom:30px;
    background:#fff;
    color:#17202a;
    border-radius:25px;
    padding:25px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.school-title{
    text-align:center;
    margin-bottom:20px;
}

.school-title h2{
    color:#071952;
    font-size:22px;
}

.school-title p{
    color:#71808c;
    margin-top:5px;
}

.student-info{
    text-align:center;
    padding-bottom:20px;
    border-bottom:2px solid #edf1f5;
}

.avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    background:linear-gradient(135deg,#071952,#088395);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 12px;
    font-size:28px;
}

.student-info h2{
    color:#071952;
    font-size:24px;
}

.student-info p{
    margin-top:6px;
    color:#65727e;
}

.badges{
    margin-top:12px;
}

.badge{
    display:inline-block;
    padding:7px 13px;
    border-radius:20px;
    background:#e8f8fa;
    color:#087786;
    font-size:13px;
    font-weight:bold;
    margin:3px;
}

.table-wrapper{
    overflow-x:auto;
    margin-top:22px;
}

table{
    width:100%;
    min-width:600px;
    border-collapse:collapse;
}

th{
    padding:13px;
    background:#071952;
    color:white;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #edf0f3;
}

tr:nth-child(even){
    background:#f6fbfc;
}

.failed-row{
    background:#fff0f0 !important;
}

.failed-mark{
    color:#d62828;
    font-weight:bold;
}

.passed-mark{
    color:#16803c;
    font-weight:bold;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:22px;
}

.summary-card{
    background:#f1fafb;
    padding:17px;
    border-radius:16px;
    text-align:center;
}

.summary-card small{
    color:#65727e;
}

.summary-card strong{
    display:block;
    margin-top:7px;
    color:#071952;
    font-size:22px;
}

.status{
    margin-top:20px;
    padding:16px;
    text-align:center;
    border-radius:14px;
    font-weight:bold;
    font-size:17px;
}

.pass{
    background:#d9f5df;
    color:#146b2b;
}

.fail{
    background:#ffe0e0;
    color:#a51f1f;
}

.failed-subjects{
    margin-top:20px;
    padding:18px;
    border-radius:15px;
    background:#fff2f2;
    border:1px solid #ffd0d0;
}

.failed-subjects h3{
    color:#a51f1f;
    margin-bottom:10px;
}

.failed-subjects ul{
    padding-left:22px;
}

.failed-subjects li{
    color:#a51f1f;
    margin:6px 0;
    font-weight:bold;
}

.parent-box{
    margin-top:20px;
    padding:18px;
    border-radius:16px;
    background:#eef8ff;
    border:1px solid #cce8ff;
}

.parent-box h3{
    color:#071952;
    margin-bottom:8px;
}

.parent-box p{
    color:#65727e;
    font-size:14px;
    margin-bottom:6px;
}

footer{
    text-align:center;
    padding:30px 15px;
    color:#bfe8f0;
    font-size:13px;
}

.error-box{
    text-align:center;
    padding:35px;
}

.error-icon{
    font-size:55px;
}

.error-box h2{
    color:#b21f1f;
    margin-top:10px;
}

.error-box p{
    margin-top:10px;
    color:#65727e;
}

@media(max-width:600px){

    header h1{
        font-size:22px;
    }

    .search-box{
        padding:20px;
    }

    .summary{
        grid-template-columns:1fr;
    }

    #result{
        padding:18px;
    }

}
</style>
</head>

};


/* ==========================================
   SUBJECTS
========================================== */

const subjects = [
    "English",
    "Mathematics",
    "Physics",
    "Chemistry",
    "Biology",
    "Somali",
    "Arabic",
    "Geography",
    "History",
    "Computer"
];


/* ==========================================
   MARKS
========================================== */

function getMarks(roll){

    const number = parseInt(
        roll.replace("BS",""),
        10
    );

    const marks = [];

    subjects.forEach(function(subject,index){

        const mark =
            (number * 7 + index * 19) % 101;

        marks.push(mark);

    });

    return marks;
}


/* ==========================================
   GRADE
========================================== */

function getGrade(mark){

    if(mark >= 90) return "A+";
    if(mark >= 80) return "A";
    if(mark >= 70) return "B";
    if(mark >= 60) return "C";
    if(mark >= 50) return "D";

    return "E";
}


/* ==========================================
   SEARCH
========================================== */

function searchStudent(){

    const input =
        document.getElementById("rollNumber");

    const result =
        document.getElementById("result");

    let roll =
        input.value
        .trim()
        .toUpperCase()
        .replace(/\s+/g,"");


    if(roll === ""){

        alert("Fadlan geli Roll Number-ka.");

        input.focus();

        return;
    }


    const student =
        students[roll];


    /* ARDAY LAMA HELIN */

    if(!student){

        result.style.display = "block";

        result.innerHTML = `

            <div class="error-box">

                <div class="error-icon">
                    🔍
                </div>

                <h2>
                    Ardayga lama helin
                </h2>

                <p>
                    Roll Number-ka
                    <b>${roll}</b>
                    lama helin.
                </p>

            </div>

        `;

        return;
    }


    /* MARKS */

    const marks =
        getMarks(roll);


    let total = 0;

    let failedSubjects = [];


    marks.forEach(function(mark,index){

        total += mark;

        if(mark < 50){

            failedSubjects.push(
                subjects[index]
            );

        }

    });


    const average =
        total / subjects.length;


    const overallGrade =
        getGrade(average);


    /*
       7 AMA KA BADAN = DHACAY
       0 ilaa 6 = GUDUBAY
    */

    const passed =
        failedSubjects.length < 7;


    /* TABLE */

    let table = `

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>#</th>
                        <th>Maaddada</th>
                        <th>Dhibcaha</th>
                        <th>Grade</th>
                        <th>Status</th>

                    </tr>

                </thead>

                <tbody>

    `;


    subjects.forEach(function(subject,index){

        const mark =
            marks[index];

        const failed =
            mark < 50;


        table += `

            <tr class="${failed ? "failed-row" : ""}">

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${subject}
                </td>

                <td class="
                    ${failed
                    ? "failed-mark"
                    : "passed-mark"}
                ">
                    ${mark}/100
                </td>

                <td>
                    <b>
                        ${getGrade(mark)}
                    </b>
                </td>

                <td>
                    ${
                        failed
                        ? "❌ Dhacay"
                        : "✅ Gudbay"
                    }
                </td>

            </tr>

        `;

    });


    table += `

                </tbody>

            </table>

        </div>

    `;


    /* FAILED SUBJECTS */

    let failedHTML = "";


    if(failedSubjects.length > 0){

        failedHTML = `

            <div class="failed-subjects">

                <h3>
                    ❌ Maaddooyinka uu ku dhacay
                </h3>

                <ul>

                    ${
                        failedSubjects
                        .map(function(subject){

                            return `
                                <li>
                                    ${subject}
                                </li>
                            `;

                        })
                        .join("")
                    }

                </ul>

                <p style="
                    margin-top:12px;
                    color:#555;
                ">

                    Tirada maaddooyinka uu ku dhacay:

                    <b>
                        ${failedSubjects.length}
                    </b>

                </p>

            </div>

        `;

    }


    /* RESULT */

    result.innerHTML = `

        <div class="school-title">

            <h2>
                BURSALAH SECONDARY SCHOOL
            </h2>

            <p>
                Official Student Result
            </p>

        </div>


        <div class="student-info">

            <div class="avatar">
                🎓
            </div>

            <h2>
                ${student.name}
            </h2>

            <p>
                ${student.class}
            </p>

            <div class="badges">

                <span class="badge">
                    🆔 ${roll}
                </span>

                <span class="badge">
                    📚 ${student.class}
                </span>

            </div>

        </div>


        ${table}


        <div class="summary">

            <div class="summary-card">

                <small>
                    Total
                </small>

                <strong>
                    ${total}/1000
                </strong>

            </div>


            <div class="summary-card">

                <small>
                    Average
                </small>

                <strong>
                    ${average.toFixed(1)}%
                </strong>

            </div>


            <div class="summary-card">

                <small>
                    Overall Grade
                </small>

                <strong>
                    ${overallGrade}
                </strong>

            </div>

        </div>


        <div class="
            status
            ${passed ? "pass" : "fail"}
        ">

            ${
                passed
                ? "🎉 HAMBALYO! ARDAYGU WUU GUDUBAY."
                : "❌ ARDAYGU WUU DHACAY."
            }

        </div>


        ${failedHTML}

    `;


    result.style.display = "block";


    setTimeout(function(){

        result.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    },100);

}

========================================== */

.addEventListener("submit",function(event){

    event.preventDefault();

    searchStudent();

});
